server {
  listen 80 default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;
  location / {
    try_files $uri $uri/ =404;
  }
}

server {
  listen 443 ssl default_server;
  server_name _;
  index index.html index.htm index.nginx-debian.html;
  root /var/www/html;

  # bot避けのためのvhostで、この証明書は有効期限がきれています
  ssl_certificate     /etc/nginx/tls/_.t.isucon.dev.crt;
  ssl_certificate_key /etc/nginx/tls/_.t.isucon.dev.key;
  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  location / {
    try_files $uri $uri/ =404;
  }
}

# アイコン画像のキャッシュ（GET /api/user/:name/icon の 8 割が If-None-Match 付きで 304 になる）。
# nginx がキャッシュした ETag と If-None-Match を比べて 304 を返す。有効 1 秒なので、
# アイコン更新の反映は最大 1 秒遅れ（アプリケーションマニュアルの猶予は 2 秒）
proxy_cache_path /var/lib/nginx/icons levels=1:2 keys_zone=icons:32m max_size=1g inactive=30s use_temp_path=off;

# アプリは isucon13-1 の :8080。接続を使い回す
upstream isupipe {
  server __ISU1_IP__:8080;
  keepalive 128;
}

server {
  listen 443 ssl;
  server_name u.isucon.local;
  server_name *.u.isucon.local;

  ssl_certificate     /etc/nginx/tls/_.u.isucon.local.crt;
  ssl_certificate_key /etc/nginx/tls/_.u.isucon.local.key;

  ssl_protocols TLSv1.3;
  ssl_prefer_server_ciphers off;

  client_max_body_size 10m;
  root /home/isucon/webapp/public/;
  location / {
    try_files $uri /index.html;
  }
  location ~ ^/api/user/[^/]+/icon$ {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_cache icons;
    proxy_cache_key $uri;
    proxy_cache_valid 200 1s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 2s;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://isupipe;
  }
  location /api {
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_pass http://isupipe;
  }
}